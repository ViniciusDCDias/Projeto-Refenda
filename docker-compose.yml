
services:
  db:
    image: mysql:8.0
    container_name: refenda-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: refenda123
      MYSQL_DATABASE: refenda
    ports:
      - "3306:3306"
    volumes:
      - refenda-dados:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-refenda123}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: refenda-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "mysql://root:refenda123@db:3306/refenda"
      JWT_SECRET: "chave_secreta_refenda"
    depends_on:
      db:
        condition: service_healthy

volumes:
  refenda-dados:
